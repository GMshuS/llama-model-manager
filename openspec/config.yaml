schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  项目名称：llama.cpp Model Manager (llama-model-manager)
  项目描述：llama.cpp 模型管理桌面应用，用于管理 llama.cpp 模型的下载、启动 API 服务等。

  技术栈：
  - 前端：React 19 + React Router 7 + Vite 8 + TailwindCSS 4
  - 后端：Express 5 (Node.js)
  - 桌面封装：Electron 42 + electron-builder 26
  - 实时通信：WebSocket (ws 库)
  - 文件监听：chokidar
  - 构建工具：Vite (使用 @vitejs/plugin-react 和 @tailwindcss/vite)

  项目结构：
  - llama-model-manager/ 为应用主目录
  - src/ 为 React 前端源码 (App.jsx, main.jsx, components/, hooks/, store/)
  - server/ 为 Express 后端源码 (index.js, routes/, services/, store/)
  - electron/ 为 Electron 主进程代码 (main.js, preload.js)
  - dist/ 为 Vite 构建输出目录
  - models/ 为 llama.cpp 模型存放目录

  开发约定：
  - 使用 ES Modules (package.json 中 "type": "module")
  - 前端开发模式：vite dev server 运行在 5173 端口，代理 /api 到 Express (3001 端口)
  - 后端服务：node server/index.js 运行在 3001 端口
  - Electron 构建：vite build && electron .
  - 打包发布：vite build && electron-builder (Windows NSIS 安装包)
  - 所有 spec 文档使用中文编写

  llama.cpp 服务启动示例：
  llama-server.exe -m models/xxx.gguf -ngl 28 --port 8880 --host 0.0.0.0 -c 24576 -t 8 --timeout 120 --parallel 1 --batch-size 1024 --ubatch-size 512 --cont-batching --jinja

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - 所有提案使用中文编写
    - 保持简洁明了，重点突出
  design:
    - 所有设计文档使用中文编写
    - 包含架构图或流程图时优先使用 Mermaid
  tasks:
    - 所有任务描述使用中文编写
    - 每个任务应足够具体，可在 2 小时内完成
  specs:
    - 所有规格文档使用中文编写
    - 使用 GIVEN/WHEN/THEN 格式描述场景

# --------------------------
# 5. 任务执行引擎配置 (重点：tasks.md 并行执行)
# --------------------------
execution:
  # ========== 并行执行核心开关 ==========
  # 开启 tasks.md 内部任务并行 (true/false)
  enable_parallel: true
  # 默认最大并发任务数 (推荐 2~4，避免AI过载)
  parallel_limit: 3
  # 是否遵守任务依赖关系 (@dep)
  respect_dependencies: true
  # 并行组之间是否串行执行 (true=推荐，防止逻辑混乱)
  serial_between_groups: true

  # ========== 执行行为配置 ==========
  # 执行任务时是否自动保存文件
  auto_save: true
  # 执行完成后是否自动校验规格一致性
  auto_verify: true
  # 注：breakpoint_resume 在 v1.0.0 中尚未支持，如需断点续跑请关注后续版本