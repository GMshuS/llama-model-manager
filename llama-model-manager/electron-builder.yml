appId: com.llamamodelmanager.app
productName: llama-model-manager
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - server/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - "*.png"
      - "*.svg"
      - "*.ico"
win:
  target:
    - target: nsis
      arch:
        - x64
  forceCodeSigning: false
  icon: assets/tray-icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
extraMetadata:
  main: electron/main.js
